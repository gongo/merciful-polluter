name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-version: '5.4'
            phpunit-version: '^4.8.35'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '5.5'
            phpunit-version: '^4.8.35'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '5.6'
            phpunit-version: '^4.8.35'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '7.0'
            phpunit-version: '^6'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '7.1'
            phpunit-version: '^6'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '7.2'
            phpunit-version: '^8'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '7.3'
            phpunit-version: '^9'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '7.4'
            phpunit-version: '^9'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '8.0'
            phpunit-version: '^9'
            phpunit-config: 'phpunit.xml'
            unrun-phpstan: true
          - php-version: '8.1'
            phpunit-version: '^10'
            phpunit-config: 'phpunit10.xml'
          - php-version: '8.2'
            phpunit-version: '^11'
            phpunit-config: 'phpunit10.xml'
          - php-version: '8.3'
            phpunit-version: '^11'
            phpunit-config: 'phpunit10.xml'
          - php-version: '8.4'
            phpunit-version: '^11'
            phpunit-config: 'phpunit10.xml'

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP (with composer)
      uses: shivammathur/setup-php@v2
      if: ${{ matrix.unrun-phpstan }}
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer
        coverage: xdebug
    - name: Setup PHP (with composer, phpstan)
      if: ${{ ! matrix.unrun-phpstan }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer, phpstan
        coverage: xdebug

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-
    - name: Install dependencies
      run: composer install --prefer-dist --dev
    - name: Install specific PHPUnit version
      run: composer require --dev phpunit/phpunit:"${{ matrix.phpunit-version }}" --with-all-dependencies
    - name: Run tests (PHPUnit 4-9)
      if: ${{ matrix.phpunit-config == 'phpunit.xml' }}
      run: ./vendor/bin/phpunit -c phpunit.xml
    - name: Run tests (PHPUnit 10+)
      if: ${{ matrix.phpunit-config == 'phpunit10.xml' }}
      run: |
        mkdir -p build/logs
        ./vendor/bin/phpunit -c phpunit10.xml --coverage-clover build/logs/clover.xml
    - name: Update coverage reports
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # bin file was named `coveralls` until PHP 5.4
        # see: https://github.com/php-coveralls/php-coveralls/blob/v2.6.0/CHANGELOG.md
        [[ -f vendor/bin/php-coveralls ]] && COVERALLS_PATH=vendor/bin/php-coveralls || COVERALLS_PATH=vendor/bin/coveralls
        $COVERALLS_PATH
    - name: Run PHPStan
      if: ${{ ! matrix.unrun-phpstan }}
      run: phpstan analyse -l 9 src
